[package]
name = "moat-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Ratatui terminal UI for Moat encrypted messenger"

[[bin]]
name = "moat"
path = "src/main.rs"

[dependencies]
moat-core = { workspace = true }
moat-atproto = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
tokio = { workspace = true }
dirs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_with = { version = "3", default-features = false, features = ["base64", "macros"] }
thiserror = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
hex = "0.4"
hostname = "0.4"
image = { version = "0.25", features = ["jpeg", "png"] }
thumbhash = "0.1"
ratatui-image = { version = "10", default-features = false, features = ["tokio", "crossterm", "image-defaults"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
futures-util = "0.3"
base64 = { workspace = true }
axum = { version = "0.7", features = ["json", "macros"] }
tokio-stream = { version = "0.1", features = ["sync"] }

[dev-dependencies]
tempfile = { workspace = true }
proptest = "1"
